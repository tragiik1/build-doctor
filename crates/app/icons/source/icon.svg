<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
 <defs>
  <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1411"/><stop offset="1" stop-color="#060908"/></linearGradient>
  <radialGradient id="halo" cx="352" cy="256" r="150" gradientUnits="userSpaceOnUse"><stop offset="0.45" stop-color="#ffa21a" stop-opacity="0.42"/><stop offset="0.7" stop-color="#e07a10" stop-opacity="0.18"/><stop offset="1" stop-color="#e07a10" stop-opacity="0"/></radialGradient>
  <radialGradient id="lens" cx="0.5" cy="0.45" r="0.6"><stop offset="0" stop-color="#ffd21a"/><stop offset="0.6" stop-color="#ffb30f"/><stop offset="1" stop-color="#f08c10"/></radialGradient>
  <clipPath id="tileClip"><rect x="16" y="16" width="480" height="480" rx="108"/></clipPath>
 </defs>
 <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#tile)"/>
