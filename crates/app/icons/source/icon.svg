 <rect x="49" y="240" width="40" height="32" rx="6" fill="#f6ead0"/>
 <rect x="423" y="240" width="40" height="32" rx="6" fill="#f6ead0"/>
 <!-- lit lens, inset in the frame with a dark gap -->
 <circle cx="352" cy="256" r="60" fill="#160f06"/>
 <circle cx="352" cy="256" r="50" fill="url(#lens)"/>
 <!-- frames and bridge -->
 <circle cx="160" cy="256" r="71" fill="none" stroke="#f6ead0" stroke-width="21"/>
 <circle cx="352" cy="256" r="71" fill="none" stroke="#f6ead0" stroke-width="21"/>
 <path d="M226 236 Q256 216 286 236" fill="none" stroke="#f6ead0" stroke-width="18"/>
</svg>
