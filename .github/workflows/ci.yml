name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DOCTOR_DATA_DIR: ${{ github.workspace }}/.doctor-data
  # PoB2 releases the precision gate runs on: the pinned release plus the one
  # most fixtures reproduce on. Keep in step with PINNED_POB and fixtures.toml.
  GATE_POB_VERSIONS: "0.23.1 0.21.0"

defaults:
  run:
    shell: bash

jobs:
  # Format and clippy for everything but the desktop app, which needs WebKit
  # on Linux; Ubuntu's mirror took over 15 minutes for it twice. The app is
  # linted where it is built, on Windows.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal -c clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude build-doctor --all-targets --locked -- -D warnings

  # The engine, its tests and the precision gate on both platforms. The
  # desktop app is built and linted on Windows, so the
  # Linux leg skips it and needs no system packages.
  precision:
    name: precision (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal -c clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - uses: actions/cache@v4
        with:
          path: .doctor-data/pob
          key: pob-${{ runner.os }}-${{ env.GATE_POB_VERSIONS }}

      - name: Build
        env:
          BUILD_DOCTOR_VERSION: 0.1.${{ github.run_number }}
          BUILD_DOCTOR_COMMIT: ${{ github.sha }}
        run: cargo build --release --locked $( [ "$RUNNER_OS" = Linux ] && echo "--workspace --exclude build-doctor" )

      - name: Lint the desktop app
        if: runner.os == 'Windows'
        run: cargo clippy -p build-doctor --all-targets --locked -- -D warnings

      - name: Unit tests
        run: cargo test --release --locked $( [ "$RUNNER_OS" = Linux ] && echo "--workspace --exclude build-doctor" )

      - name: Install PoB2 releases (download and SHA-1 verify)
        run: |
          for v in $GATE_POB_VERSIONS; do
            if [ -d "$DOCTOR_DATA_DIR/pob/$v" ]; then
              ./target/release/doctor engine verify --version "$v"
            else
              ./target/release/doctor engine install --version "$v"
            fi
          done

      - name: Engine tests (sandbox, determinism)
        env:
          DOCTOR_POB_DIR: ${{ github.workspace }}/.doctor-data/pob/0.23.1
        run: cargo test --release --locked -p pob -- --include-ignored

      - name: Precision gate
        run: ./target/release/doctor verify

      - name: Binary sizes
        run: ls -l target/release/ | grep -E " (build-)?doctor(\.exe)?$"

      - name: Describe the Windows app for the updater
        if: runner.os == 'Windows'
        run: |
          sha=$(sha256sum target/release/build-doctor.exe | cut -d' ' -f1)
          doctor=$(sha256sum target/release/doctor.exe | cut -d' ' -f1)
          printf '{"version":"0.1.%s","commit":"%s","sha256":"%s","doctorSha256":"%s"}\n' \
            "${{ github.run_number }}" "${{ github.sha }}" "$sha" "$doctor" > target/release/version.json
          cat target/release/version.json

      - name: Upload the Windows app
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: build-doctor-windows
          path: |
            target/release/build-doctor.exe
            target/release/doctor.exe
            target/release/version.json
          retention-days: 30

  # Every green build of main becomes the release at /releases/latest, which
  # the app's updater reads.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, precision]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-doctor-windows
          path: dist
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packaging
          path: src
      # The "Build Doctor" folder: both programs and the data folder that
      # makes them keep Path of Building inside it.
      - name: Make the folder zip
        run: |
          mkdir -p "Build Doctor/data"
          cp dist/build-doctor.exe dist/doctor.exe "Build Doctor/"
          cp src/packaging/data-README.txt "Build Doctor/data/README.txt"
          zip -r -X Build-Doctor.zip "Build Doctor"
          unzip -l Build-Doctor.zip
      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="0.1.${{ github.run_number }}"
          tag="v${version}"
          notes="Build Doctor ${version} for Windows, built from ${GITHUB_SHA::7}. Download Build-Doctor.zip, extract it anywhere you can write to, and run build-doctor.exe in the Build Doctor folder; everything it needs stays in that folder. It updates itself from here."
          gh release create "$tag" Build-Doctor.zip dist/build-doctor.exe dist/doctor.exe dist/version.json \
            --target "$GITHUB_SHA" --title "Build Doctor ${version}" --notes "$notes" --latest
