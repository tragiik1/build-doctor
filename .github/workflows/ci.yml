name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DOCTOR_DATA_DIR: ${{ github.workspace }}/.doctor-data
  # PoB2 releases the precision gate runs on: the pinned release plus the one
  # most fixtures reproduce on. Keep in step with PINNED_POB and fixtures.toml.
  GATE_POB_VERSIONS: "0.23.1 0.21.0"

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Desktop app system libraries
        # Ubuntu's mirror is sometimes slow (25 MB of WebKit took over six
        # minutes on 2026-11-20); a hard limit still stops a hang.
        timeout-minutes: 15
        run: |
          opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          sudo apt-get $opts update
          sudo apt-get $opts install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev
      - run: rustup toolchain install stable --profile minimal -c clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  # The engine, its tests and the precision gate on both platforms. The
  # desktop app is built on Windows (and compiled by lint on Linux), so the
  # Linux leg skips it and needs no system packages.
  precision:
    name: precision (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - uses: actions/cache@v4
        with:
          path: .doctor-data/pob
          key: pob-${{ runner.os }}-${{ env.GATE_POB_VERSIONS }}

      - name: Build
        env:
          BUILD_DOCTOR_VERSION: 0.1.${{ github.run_number }}
          BUILD_DOCTOR_COMMIT: ${{ github.sha }}
        run: cargo build --release --locked $( [ "$RUNNER_OS" = Linux ] && echo "--workspace --exclude build-doctor" )

      - name: Unit tests
        run: cargo test --release --locked $( [ "$RUNNER_OS" = Linux ] && echo "--workspace --exclude build-doctor" )

      - name: Install PoB2 releases (download and SHA-1 verify)
        run: |
          for v in $GATE_POB_VERSIONS; do
            if [ -d "$DOCTOR_DATA_DIR/pob/$v" ]; then
              ./target/release/doctor engine verify --version "$v"
            else
              ./target/release/doctor engine install --version "$v"
            fi
          done

      - name: Engine tests (sandbox, determinism)
        env:
          DOCTOR_POB_DIR: ${{ github.workspace }}/.doctor-data/pob/0.23.1
        run: cargo test --release --locked -p pob -- --include-ignored

      - name: Precision gate
        run: ./target/release/doctor verify

      - name: Binary sizes
        run: ls -l target/release/ | grep -E " (build-)?doctor(\.exe)?$"

      - name: Describe the Windows app for the updater
        if: runner.os == 'Windows'
        run: |
          sha=$(sha256sum target/release/build-doctor.exe | cut -d' ' -f1)
          printf '{"version":"0.1.%s","commit":"%s","sha256":"%s"}\n' \
            "${{ github.run_number }}" "${{ github.sha }}" "$sha" > target/release/version.json
          cat target/release/version.json

      - name: Upload the Windows app
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: build-doctor-windows
          path: |
            target/release/build-doctor.exe
            target/release/doctor.exe
            target/release/version.json
          retention-days: 30

  # Every green build of main becomes the release at /releases/latest, which
  # the app's updater reads.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, precision]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-doctor-windows
          path: dist
      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="0.1.${{ github.run_number }}"
          tag="v${version}"
          notes="Build Doctor ${version} for Windows, built from ${GITHUB_SHA::7}. Download build-doctor.exe and run it; it updates itself from here."
          gh release create "$tag" dist/build-doctor.exe dist/doctor.exe dist/version.json \
            --target "$GITHUB_SHA" --title "Build Doctor ${version}" --notes "$notes" --latest
