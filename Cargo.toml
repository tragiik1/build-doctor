[workspace]
resolver = "3"
members = ["crates/pob", "crates/analysis", "crates/assistant", "crates/doctor", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
pob = { path = "crates/pob" }
analysis = { path = "crates/analysis" }
assistant = { path = "crates/assistant" }
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
flate2 = "1"
libc = "0.2"
mlua = { version = "0.12", features = ["luajit", "vendored"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1_smol = "1"
sha2 = "0.10"
thiserror = "2"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
ureq = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
cc = "1.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Build LuaJIT from the exact commit the PoB2 app ships (see vendor/README.md).
[patch.crates-io]
luajit-src = { path = "vendor/luajit-src" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
