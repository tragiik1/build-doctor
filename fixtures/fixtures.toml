# Fixture builds for `doctor verify`.
#
# Each file is a public build saved by the Path of Building PoE2 desktop app,
# so the <PlayerStat>, <MinionStat> and <FullDPSSkill> values inside it are
# the app's own output. On every PoB version in `exact_on`, the doctor must
# reproduce all of them string-for-string.
#
# `exact_on` was found with `doctor verify --sweep` against the PoB2 releases
# 0.16.0, 0.17.1, 0.18.0, 0.19.0, 0.20.0, 0.21.0, 0.21.1, 0.22.0, 0.23.0 and
# 0.23.1 (2026-11-19). A build only reproduces on the release(s) whose
# calculations match the one that saved it, which is why the lists differ.
#
# A quarantined fixture is kept and reported but not used as an oracle; the
# reason must say why.

[[fixture]]
file = "builds/maxroll_gd79010q.xml"
source = "https://maxroll.gg/poe2/pob/gd79010q (forum Build of the Week, 0.5.5)"
build = "Snap Shaman (Druid), level 94"
exact_on = ["0.22.0", "0.23.0", "0.23.1"]

